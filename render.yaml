services:
  - type: web
    name: rag-chatbot-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_MODEL
        value: llama-3.1-8b-instant
      - key: DATABASE_URL
        sync: false
      - key: JINA_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
